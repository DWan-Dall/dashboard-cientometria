name: CI

on:
  pull_request:
  push:
    branches: [main, metodo-validado, "feat/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validacoes:
    name: Validações do repositório e lint PHP
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Arquivos congelados do modo original e ausência de dados licenciados
        run: python scripts/verificar_repositorio.py
      - name: Lint PHP
        run: |
          php -v
          for f in *.php; do php -l "$f"; done

  python:
    name: Testes Python (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Dependências
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check cientometria scripts tests
      - name: Análise de segurança (bandit)
        run: bandit -q -r cientometria scripts/pipeline.py scripts/verificar_repositorio.py
      - name: Vulnerabilidades conhecidas nas dependências (pip-audit)
        run: pip-audit -r requirements-dev.txt --progress-spinner off
      - name: Testes (inclui HTTP contra php -S; os de dados reais são pulados sem os arquivos)
        env:
          MPLBACKEND: Agg
        run: |
          php -v
          python -m pytest -q -rs

  docker:
    name: Build e inicialização do Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Build
        run: docker build -t dashboard-cientometria:local .
      - name: Inicialização e verificação
        run: |
          docker compose up -d --no-build
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' dashboard-cientometria 2>/dev/null || true)
            [ "$s" = "healthy" ] && break
            sleep 2
          done
          docker compose ps
          test "$(docker inspect -f '{{.State.Health.Status}}' dashboard-cientometria)" = "healthy"
          curl -fsS http://127.0.0.1:8000/ | grep -q 'csrf-token'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/.git/HEAD)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api.php?acao=listar_projetos)" = "403"
          test "$(docker exec dashboard-cientometria id -u)" = "10001"
      - name: Logs
        if: always()
        run: docker compose logs --no-color | tail -50; docker compose down -v
